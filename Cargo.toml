[package]
name = "arisa"
version = "0.2.1"
edition = "2024"

[dependencies]
base64 = "0.22"
jni = "0.22"
openssl = { version = "0.10", features = ["vendored"] }
prost = "0.14"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.33", features = [
    "bundled-sqlcipher-vendored-openssl",
] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "time",
    "sync",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", default-features = false, features = [
    "server",
    "router",
    "codegen",
] }
tonic-prost = "0.14"
tonic-reflection = { version = "0.14", features = ["server"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3.2"
tonic-prost-build = "0.14"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
